<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 4 - Flexbox</title>
    <style>

      .flex_boxes {
        display: flex;
        justify-content: space-evenly;
        padding: 10px;
      }

      .flip-card {
        background-color: rgb(62, 121, 6);
        width: 500px;
        height: 300px;
        perspective: 1000px;
      }

/* This container is needed to position the front and back side */
      .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 0.8s;
        transform-style: preserve-3d;
      }

/* Do an horizontal flip when you move the mouse over the flip box container */
      .flip-card:hover .flip-card-inner {
        transform: rotateY(180deg);
      }

/* Position the front and back side */
      .flip-card-front, .flip-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden; /* Safari */
        backface-visibility: hidden;
        color: rgb(62, 121, 6);
      }

/* Style the front side (fallback if image is missing) */
      .flip-card-front {
        background-color: rgb(62, 121, 6);
      }

/* Style the back side */
    .flip-card-back {
      background-color: rgb(62, 121, 6);
      color: white;
      transform: rotateY(180deg);
    }

    </style>
  </head>

  <body style="background-color: rgb(62, 121, 6);">
    <h1>Jungle Animals</h1>

  <div class="flex_boxes">
  <div class="flip-card">
    <div class="flip-card-inner">
      <div class="flip-card-front">
        <img src="https://blogs.smithsonianmag.com/science/files/2013/03/gecko.jpg" alt="Avatar" style="height:300px;">
      </div>
      <div class="flip-card-back">
        <h1>Geckos</h1>
        <p>are very cool</p>
        <p>this one is named lionel</p>
      </div>
    </div>
  </div>
   

  <div class="flip-card">
    <div class="flip-card-inner">
      <div class="flip-card-front" style="color: rgb(62, 121, 6)">
        
      </div>
      <div class="flip-card-back">
        <img src="https://www.swelluk.com/wp-content/uploads/sites/3/2021/02/royal-pyhon-1-26.jpg" alt="chameleon" style="height:300px;">
      </div>
    </div>
  </div>
  </div>
  </body>
</html>
